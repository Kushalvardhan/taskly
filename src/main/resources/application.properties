spring.application.name=backend
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5111}/${DATABASE_NAME:taskly}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}


#docker related properties
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop

logging.level.com.taskly.backend=${LOG_LEVEL:INFO}

#Flyway related properties
# Enable Flyway
spring.flyway.enabled=true

# Location of SQL migration files
spring.flyway.locations=classpath:db/migration

# Allow Flyway to baseline the existing non-empty database
spring.flyway.baseline-on-migrate=false

#logging.level.org.springframework.security=TRACE


